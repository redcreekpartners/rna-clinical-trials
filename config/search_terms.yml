  - RNA medicine
  - programmable RNA therapeutic
  - post-transcriptional gene therapy

# ClinicalTrials.gov ORs the words of an unquoted multi-word query, so these match
# on a common word alone: "nucleic acid medicine" returns ~2,000 trials while the
# quoted phrase returns none. They are still searched, for recall, but a trial
# found only through one of them is flagged loose-term-only and excluded unless
# something else identifies it as an RNA trial.
loose:
  - nucleic acid medicine
  - RNA medicine
  - RNA delivery
  - RNA formulation
  - RNA manufacturing
  - RNA stability therapeutic
  - RNA modification therapeutic
  - RNA immunogenicity therapeutic
  - oligonucleotide drug
  - oligonucleotide therapy
  - post-transcriptional gene therapy
  - in vitro transcription therapeutic RNA
  - RNA purification manufacturing
  - RNA quality control manufacturing
  - mRNA therapy
  - messenger RNA

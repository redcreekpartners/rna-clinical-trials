name: Build review spreadsheet

# Run by hand from the Actions tab; the spreadsheet is attached to the run as a
# downloadable artifact. Not committed: it is a 1 MB binary that would change
# every day.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_review_sheet.py --out rna-clinical-trials-review.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: rna-clinical-trials-review
          path: rna-clinical-trials-review.xlsx
          retention-days: 30
